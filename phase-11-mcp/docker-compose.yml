services:
  integration-mysql:
    image: mysql:8.0
    container_name: phase11-integration-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - phase11_integration_mysql:/var/lib/mysql
      - ../phase-01-monolith/database/schema.sql:/docker-entrypoint-initdb.d/01-mic-schema.sql:ro
      - ../phase-01-monolith/database/seed.sql:/docker-entrypoint-initdb.d/02-mic-seed.sql:ro
      - ./warehouse-init.sql:/docker-entrypoint-initdb.d/03-warehouse-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      default:
        aliases:
          - mysql
          - warehouse-mysql

  iam-mock:
    build: ./iam-mock
    container_name: phase11-iam-mock
    ports:
      - "9001:9001"
    environment:
      ASPNETCORE_URLS: http://+:9001
      IAM_ISSUER: http://iam-mock:9001
      IAM_KEY_ID: tsid-mock-rs512-2026
      IAM_USER_CLIENT_ID: 11111111-2222-4333-8444-555555555555

  warehouse-bc:
    build: .
    container_name: phase11-warehouse-bc
    ports:
      - "8083:8081"
    environment:
      LEGACY_DB_HOST: integration-mysql
      LEGACY_DB_PORT: "3306"
      LEGACY_DB_USER: root
      LEGACY_DB_PASSWORD: root
      LEGACY_DB_NAME: mic
      WAREHOUSE_DB_HOST: integration-mysql
      WAREHOUSE_DB_PORT: "3306"
      WAREHOUSE_DB_USER: root
      WAREHOUSE_DB_PASSWORD: root
      WAREHOUSE_DB_NAME: warehouse_db
      READ_MODE: warehouse
      IAM_ISSUER: http://iam-mock:9001
      IAM_JWKS_URL: http://iam-mock:9001/.well-known/jwks.json
      IAM_ALLOWED_CLIENT_IDS: 11111111-2222-4333-8444-555555555555,svc-orders,svc-warehouse-agent
    depends_on:
      integration-mysql:
        condition: service_healthy
      iam-mock:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: phase11-adminer
    ports:
      - "8082:8080"
    depends_on:
      integration-mysql:
        condition: service_healthy

  # The MCP server is NOT part of `docker compose up`: it speaks JSON-RPC on
  # stdin/stdout and is started by the MCP client (see .mcp.json), one
  # process per session:  docker compose run --rm -T --no-deps mcp-server
  mcp-server:
    build: ./mcp-server
    profiles: ["mcp"]
    stdin_open: true
    environment:
      BC_BASE_URL: http://warehouse-bc:8081
      IAM_TOKEN_URL: http://iam-mock:9001/oauth/token
      MCP_CLIENT_ID: svc-warehouse-agent
      MCP_CLIENT_SECRET: demo

  # One-time copy of the legacy articles into the warehouse store (same ids),
  # exactly as in Phase 07:  docker compose --profile tools run --rm backfill-articles
  backfill-articles:
    image: mysql:8.0
    profiles: ["tools"]
    volumes:
      - ./backfill-articles.sql:/backfill-articles.sql:ro
    entrypoint: ["sh", "-c", "mysql -hintegration-mysql -uroot -proot < /backfill-articles.sql"]
    depends_on:
      integration-mysql:
        condition: service_healthy

  # The exercise suite (the MCP tool handlers, no stack needed):
  #   docker compose run --build --rm test
  test:
    profiles: ["test"]
    build:
      context: ./mcp-server
      target: builder
    command: go test ./... -v

volumes:
  phase11_integration_mysql:
