events {}

http {
  upstream mic_app {
    server mic-app:80;
  }

  upstream mic_projection_adapter {
    server mic-projection-adapter:8080;
  }

  upstream iam_mock {
    server iam-mock:9001;
  }

  upstream warehouse_bc {
    server warehouse-bc:8081;
  }

  server {
    listen 80;

    location = /facade/health {
      default_type application/json;
      return 200 '{"status":"ok","phase":"09","mode":"mic-legacy-plus-hermes-projection","bc":"http://localhost:8083"}';
    }

    # Phase 09: MIC still owns the legacy UI, but article options can also come
    # from a consumer-owned read model populated from Hermes records.
    location = /api/articles {
      proxy_pass http://mic_projection_adapter;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_hide_header X-Strangler-Route;
      add_header X-Strangler-Route "mic-legacy-plus-hermes-projection" always;
    }

    location /iam/ {
      proxy_pass http://iam_mock/;
      proxy_set_header Host $host;
    }

    location /bc/ {
      rewrite ^/bc/(.*)$ /$1 break;
      proxy_pass http://warehouse_bc;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Workspace-ID $http_x_workspace_id;
    }

    location / {
      proxy_pass http://mic_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
