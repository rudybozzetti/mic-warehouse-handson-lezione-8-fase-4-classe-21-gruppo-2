# Phase 07 authenticated Strangler facade.
# Starter state: /api/articles is already routed to the MIC compatibility
# adapter, but MIC has not yet propagated a user Bearer token. The expected
# first result is therefore 401 from the Warehouse BC.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format strangler_fig
        '$remote_addr - [$time_iso8601] '
        '"$request" $status $body_bytes_sent '
        'upstream=$upstream_addr route_mode=$route_mode '
        'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log strangler_fig;
    error_log  /var/log/nginx/error.log warn;

    upstream monolith {
        server mic-app:80 max_fails=3 fail_timeout=10s;
    }

    upstream mic_compat_adapter {
        server mic-compat-adapter:8080 max_fails=3 fail_timeout=10s;
    }

    upstream iam_mock {
        server iam-mock:9001 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        set $route_mode "legacy";

        location = /api/articles {
            set $route_mode "warehouse-bc-auth";
            proxy_pass http://mic_compat_adapter;
            proxy_hide_header X-Strangler-Route;
            add_header X-Strangler-Route "warehouse-bc-auth" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Workspace-ID $http_x_workspace_id;
        }

        location ~ ^/api/articles/ {
            set $route_mode "legacy";
            proxy_pass http://monolith;
            proxy_hide_header X-Strangler-Route;
            add_header X-Strangler-Route "monolith" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /iam/ {
            proxy_pass http://iam_mock/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /js/auth-overlay.js {
            alias /etc/nginx/auth-overlay.js;
            add_header Cache-Control "no-store";
        }

        location / {
            set $route_mode "monolith-only";
            proxy_pass http://monolith;
            proxy_hide_header X-Strangler-Route;
            add_header X-Strangler-Route "monolith" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '<script src="/js/app.js"></script>' '<script src="/js/auth-overlay.js"></script>\n  <script src="/js/app.js"></script>';
        }

        location = /facade/health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","facade":"strangler-fig","phase":"07","mode":"authenticated-bc"}\n';
        }
    }
}
