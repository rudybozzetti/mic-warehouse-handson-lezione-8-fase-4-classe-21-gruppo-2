worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  client_max_body_size 8M;

  # Speak to PHP-FPM via TCP (default 9000) - both supervised in same container.
  upstream php_fpm { server 127.0.0.1:9000; }

  server {
    listen 80 default_server;
    root /app/public;
    index index.html;

    # Static assets first
    location /css/ { try_files $uri =404; }
    location /js/  { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }

    # API & SPA: route everything else through PHP front controller
    location / {
      try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
      fastcgi_pass php_fpm;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME /app/index.php;
      include fastcgi_params;
    }

    location @fallback {
      fastcgi_pass php_fpm;
      fastcgi_param SCRIPT_FILENAME /app/index.php;
      include fastcgi_params;
    }

    error_page 404 = @fallback;
  }
}
